<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;1,500;1,600&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>main</title>
    <link rel="stylesheet" href="../static/css/main.css">
</head>

<body>
    <div class="dateContainer"></div>
    <div class="changePagesContainer">
        <a class="pagesButton" href="get_file"><button>Get File</button></a>
        <a class="pagesButton" href="update_file"><button>update File</button></a>
        <a class="pagesButton" href="upload_file"><button>upload File</button></a>
    </div>
    <script>
        const SECOND_IN_MILLISECOND = 1000;
        function time() {
            const currentDate = new Date();
            document.getElementsByClassName("dateContainer")[0].innerHTML = currentDate.getDate() + "/" + (currentDate.getMonth() + 1) + "/" + currentDate.getFullYear() + " " + currentDate.getHours() + ":" + currentDate.getMinutes() + ":" + currentDate.getSeconds();
        }
        time();
        setInterval(time, SECOND_IN_MILLISECOND);
    </script>
</body>

</html>
